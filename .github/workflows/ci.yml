name: CI

# dev → main 的 PR 上先跑一次完整构建，坏链接/坏配置在合并前就拦下。
# 纯内容改动出错概率低，但配置和 frontmatter 写错会让整站构建失败。

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # 完整历史：文章的 git 创建日期依赖它
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
