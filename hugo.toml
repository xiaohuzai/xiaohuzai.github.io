baseURL = "https://xiaohuzai.github.io/"
title = "小虎崽的博客"

theme = "congo"

# Language
defaultContentLanguage = "zh-hans"
defaultContentLanguageInSubdir = false
hasCJKLanguage = true

# Single-language (Chinese) setup. Congo ships an English language config
# (languages.en.toml) by default; disable it so Hugo emits no empty /en/ shell
# and no duplicate /zh-hans/ section alongside the root.
# zh-hans must be defined explicitly once any [languages.*] table exists,
# since it is the defaultContentLanguage.
[languages.zh-hans]
  languageCode = "zh-hans"
  languageName = "简体中文"
  weight = 1

[languages.en]
  disabled = true

# Pagination
[pagination]
  pagerSize = 10

# Outputs
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Privacy
[privacy]
  [privacy.vimeo]
    enableDNT = true
  [privacy.x]
    enableDNT = true
  [privacy.youtube]
    privacyEnhanced = true

# Site params
[params]
  env = "production"
  description = "记录 AI、自动驾驶与工程实践"
  DateFormat = "2006-01-02"
  mainSections = ["posts"]

  # Author (Congo requires this as a table, not a string)
  [params.author]
    name = "xiaohuzai"
    # image = "img/avatar.jpg"   # uncomment + drop a 512×512 jpg to add avatar
    links = [
      { github = "https://github.com/xiaohuzai" },
    ]

  # === Congo theme params ===
  colorScheme = "congo"
  defaultAppearance = "light"
  autoSwitchAppearance = true

  enableSearch = true
  enableCodeCopy = true
  enableImageLazyLoading = true
  enableImageWebp = true
  enableQuicklink = true

  fingerprintAlgorithm = "sha256"

  # Header
  [params.header]
    layout = "basic"
    showTitle = true

  # Footer
  [params.footer]
    showCopyright = true
    showThemeAttribution = true
    showAppearanceSwitcher = true
    showScrollToTop = true

  # Homepage — "profile" layout = centered author card + recent posts below
  [params.homepage]
    layout = "profile"
    showRecent = true
    recentLimit = 5

  # Article
  [params.article]
    showDate = true
    showDateUpdated = false
    showReadingTime = true
    showTableOfContents = true
    showWordCount = true
    showEdit = false
    showAuthor = true

  # Profile (used by homepage layout = "profile")
  [params.profile]
    name = "xiaohuzai"
    headline = "AI / 自动驾驶 / 工程实践"
    bio = "记录我的技术学习笔记 —— AI、自动驾驶、工程实践。"
    # image = "img/avatar.jpg"   # uncomment + drop a 512×512 jpg to add avatar
    links = [
      { github = "https://github.com/xiaohuzai" },
    ]

  # Taxonomies — categories + tags
  [params.taxonomy]
    showTermCount = true

# Menu
[[menu.main]]
  name = "Posts"
  pageRef = "posts"
  weight = 10

[[menu.main]]
  name = "Archive"
  pageRef = "archive"
  weight = 20

[[menu.main]]
  name = "Tags"
  pageRef = "tags"
  weight = 30

[[menu.main]]
  name = "Search"
  pageRef = "search"
  weight = 40