# yaml-language-server: $schema=./quartz/plugins/quartz-plugins.schema.json
configuration:
  pageTitle: 小虎仔的小站
  pageTitleSuffix: ""
  enableSPA: true
  enablePopovers: true
  analytics: null
  locale: zh-CN
  baseUrl: xiaohuzai.github.io
  ignorePatterns:
    - private
    - templates
    - .obsidian
    - .trash
    - wiki # Karpathy LLM Wiki 插件的产物（LLM 生成，英文），只留本地不发布
  theme:
    # local = 核心不再注入 Google Fonts CDN 链接（Head.tsx 只在 googleFonts 模式下注入），
    # 字体由 local-plugins/site-style 的 @font-face 自托管接管
    fontOrigin: local
    cdnCaching: true
    # 字体实际由 local-plugins/site-style 自托管（Inter + JetBrains Mono，woff2 在
    # quartz/static/fonts/），@quartz-community/quartz-fonts 已停用；这里只是文档性的记录，
    # 重新启用该插件时保持两边一致。
    typography:
      header: Inter
      body: Inter
      code: JetBrains Mono
    # 配色：暖纸 + 深祖母绿的编辑风。亮色是暖白纸面，暗色是暖炭黑，强调色是深青绿。
    # config-palette 会以无 layer 样式注入，优先级高于主题包——改这里即生效。
    colors:
      lightMode:
        light: "#FCFBF6"
        lightgray: "#F1EFE7"
        gray: "#6E6B62"
        darkgray: "#2A2822"
        dark: "#1A1914"
        secondary: "#0F766B"
        tertiary: "#0D9488"
        highlight: rgba(15, 118, 107, 0.08)
        textHighlight: "#FFCA4766"
      darkMode:
        light: "#131211"
        lightgray: "#1D1B18"
        gray: "#8C8880"
        darkgray: "#C8C4B8"
        dark: "#EFEBE0"
        secondary: "#3EB8A4"
        tertiary: "#2CA892"
        highlight: rgba(62, 184, 164, 0.12)
        textHighlight: "#FFCA4747"
plugins:
  - source: "@quartz-community/created-modified-date"
    enabled: true
    options:
      defaultDateType: created
      priority:
        - frontmatter
        - git
        - filesystem
    order: 10
  - source: "@quartz-community/syntax-highlighting"
    enabled: true
    options:
      theme:
        light: github-light
        dark: github-dark
      keepBackground: false
    order: 20
  - source: "@quartz-community/obsidian-flavored-markdown"
    enabled: true
    options:
      comments: true
      highlight: true
      wikilinks: true
      callouts: true
      mermaid: true
      parseTags: true
      parseArrows: true
      parseBlockReferences: true
      enableInHtmlEmbed: false
      enableYouTubeEmbed: true
      enableVideoEmbed: true
      enableCheckbox: true
    order: 30
  - source: "@quartz-community/github-flavored-markdown"
    enabled: true
    order: 40
  - source: "@quartz-community/table-of-contents"
    enabled: true
    order: 50
    layout:
      position: right
      priority: 30
  - source: "@quartz-community/crawl-links"
    enabled: true
    options:
      markdownLinkResolution: shortest
    order: 60
  - source: "@quartz-community/description"
    enabled: true
    order: 70
  - source: "@quartz-community/latex"
    enabled: true
    options:
      renderEngine: katex
    order: 80
  - source: "@quartz-community/citations"
    enabled: false
    order: 85
  - source: "@quartz-community/hard-line-breaks"
    enabled: true
    order: 90
  - source: "@quartz-community/ox-hugo"
    enabled: false
    order: 91
  - source: "@quartz-community/roam"
    enabled: false
    order: 92
  # 字体改为自托管：local-plugins/site-style 直接 @font-face 引 quartz/static/fonts/ 的 woff2
  # （Inter + JetBrains Mono），不走 Google Fonts CDN。停用本插件避免它再注入 CDN 链接
  # 与冲突的 --bodyFont 变量；重新启用时记得与 configuration.theme.typography 对齐。
  - source: "@quartz-community/quartz-fonts"
    enabled: false
  - source: "@quartz-themes/core"
    enabled: true
    options:
      theme: flexoki
      mode: both
  - source: "@quartz-community/remove-draft"
    enabled: true
  - source: "@quartz-community/explicit-publish"
    enabled: false
  - source: "@quartz-community/unlisted-pages"
    enabled: true
    options: {}
    order: 45
  - source: "@quartz-community/encrypted-pages"
    enabled: true
    options:
      iterations: 600000
      passwordField: password
      unlistWhenEncrypted: false
      outputPath: static/encryptedContentIndex.json
  - source: "@quartz-community/stacked-pages"
    enabled: false
    layout:
      position: afterBody
      priority: 50
      display: all
  - source: "@quartz-community/alias-redirects"
    enabled: true
  - source: "@quartz-community/content-index"
    enabled: true
    options:
      enableSiteMap: true
      enableRSS: true
  - source: "@quartz-community/favicon"
    enabled: true
  - source: "@quartz-community/og-image"
    enabled: true
  - source: "@quartz-community/cname"
    enabled: true
  - source: "@quartz-community/canvas-page"
    enabled: true
  - source: "@quartz-community/content-page"
    enabled: true
  - source: "@quartz-community/folder-page"
    enabled: true
  - source: "@quartz-community/tag-page"
    enabled: true
  - source: "@quartz-community/explorer"
    enabled: true
    layout:
      position: left
      priority: 50
  - source: "@quartz-community/graph"
    enabled: true
    layout:
      position: right
      priority: 10
  - source: "@quartz-community/search"
    enabled: true
    layout:
      position: left
      priority: 20
      group: toolbar
      groupOptions:
        grow: true
  - source: "@quartz-community/backlinks"
    enabled: true
    layout:
      position: right
      priority: 50
  - source: "@quartz-community/article-title"
    enabled: true
    layout:
      position: beforeBody
      priority: 10
      condition: not-index # 首页顶部已有站标，不再重复一遍站名
  - source: "@quartz-community/content-meta"
    enabled: true
    layout:
      position: beforeBody
      priority: 20
  - source: "@quartz-community/tag-list"
    enabled: false
    layout:
      position: beforeBody
      priority: 30
  - source: "@quartz-community/page-title"
    enabled: false # 用 local-plugins/site-logo（Morrowind 风格站标）替代
    layout:
      position: left
      priority: 10
  - source: "@quartz-community/darkmode"
    enabled: true
    layout:
      position: left
      priority: 30
      group: toolbar
  # Morrowind-wiki 风格定制：站标 + 图标导航 + 页脚彩蛋（本地插件，源码在 local-plugins/）
  - source: "./local-plugins/site-logo"
    enabled: true
    layout:
      position: header
      priority: 10
  - source: "./local-plugins/links-nav"
    enabled: true
    layout:
      position: header
      priority: 20
  - source: "./local-plugins/footer-extras"
    enabled: true
    layout:
      position: footer
      priority: 60
  - source: "./local-plugins/mermaid-offline"
    enabled: true
  # ```dot（Graphviz）代码块：浏览器端用内置的 viz.js 渲染成 SVG
  # （WASM 单文件在 quartz/static/viz/，无外网依赖；语法错误时保留原始代码块）
  - source: "./local-plugins/dot-viz"
    enabled: true
  # 化学式：构建链路里的 KaTeX 没有 mhchem 扩展，直接写 \ce{...} 会渲染成红色的 "\ce"；
  # 这里在解析 markdown 之前把它翻译成等价的 KaTeX（Obsidian 那边 MathJax 本来就认 \ce）
  - source: "./local-plugins/mhchem-lite"
    enabled: true
  # 目录层级样式（TOC 插件输出的是平铺列表，这里注入样式做成树）
  - source: "./local-plugins/toc-tree"
    enabled: true
  # 文件夹列表页排版（folder-page 产物裸奔：标题过大、日期换行、标签圆点悬空）
  - source: "./local-plugins/folder-listing"
    enabled: true
  # 图谱连线可见性（把非激活的边从 --lightgray 重映射成可辨识的灰）
  - source: "./local-plugins/graph-links"
    enabled: true
  # 正文图片点击放大：大图会被正文栏缩到小字不可读；点开后按原始像素 1:1 显示、可滚动平移，Esc 关闭
  - source: "./local-plugins/image-zoom"
    enabled: true
  # 让 theme.colors 的调色板真正生效（否则会被主题包的 @layer 覆盖）
  - source: "./local-plugins/config-palette"
    enabled: true
  # 全站视觉精修：自托管字体（@font-face + 字体栈）与排版/组件样式，颜色仍走 theme.colors
  - source: "./local-plugins/site-style"
    enabled: true
  - source: "@quartz-community/reader-mode"
    enabled: true
    layout:
      position: left
      priority: 35
      group: toolbar
  - source: "@quartz-community/breadcrumbs"
    enabled: true
    # 默认 showCurrentPage: true 会在面包屑末尾再放一次本页标题，与下面的正文 H1 重复；
    # 关掉后面包屑止于上级目录
    options:
      showCurrentPage: false
    layout:
      position: beforeBody
      priority: 5
      condition: not-index
  - source: "@quartz-community/comments"
    enabled: false
    options:
      provider: giscus
      options: {}
    layout:
      position: afterBody
      priority: 10
  - source: "@quartz-community/footer"
    enabled: true
    options:
      links:
        GitHub: https://github.com/xiaohuzai
    layout:
      position: footer
      priority: 50
  - source: "@quartz-community/recent-notes"
    enabled: false
  - source: "@quartz-community/spacer"
    enabled: true
    options: {}
    order: 25
    layout:
      position: left
      priority: 25
      display: mobile-only
  - source: "@quartz-community/bases-page"
    enabled: true
    options: {}
    order: 50
  - source: "@quartz-community/note-properties"
    enabled: true
    options:
      includeAll: false
      includedProperties:
        - description
        - tags
        - aliases
      excludedProperties: []
      hidePropertiesView: false
      collapsed: true # 默认折叠成一行，标题下不再压一大块属性表
      delimiters: ---
      language: yaml
    order: 5
    layout:
      position: beforeBody
      priority: 15
      display: all
  - source: "@quartz-community/obsidian-plugin-excalidraw"
    enabled: true
    options:
      enableInteraction: true
      darkMode: auto
      exportPadding: 20
    order: 50
layout:
  groups:
    toolbar:
      priority: 35
      direction: row
      gap: 0.5rem
  byPageType:
    "404":
      positions:
        beforeBody: []
        left: []
        right: []
    content: {}
    folder:
      exclude:
        - reader-mode
      positions:
        right: []
    tag:
      exclude:
        - reader-mode
      positions:
        right: []
    canvas: {}
    bases: {}
